<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  html,body{margin:0;padding:0;}
  .card{
    width:1200px; height:630px;
    background: #F7F3EE;
    display:flex; align-items:center;
    padding: 0 70px;
    position:relative;
    overflow:hidden;
  }
  .left{ width:640px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:38px; }
  .brand .logo{
    width:34px; height:34px; border-radius:9px;
    background: linear-gradient(150deg, #8B5FE8, #6A38C2);
    display:flex; align-items:center; justify-content:center;
  }
  .brand .logo svg{ width:19px; height:19px; }
  .brand span{ font-weight:800; font-size:20px; color:#2A2438; }
  h1{
    font-size: 56px; line-height:1.08; font-weight:800;
    color:#22202A; margin:0 0 22px;
    letter-spacing:-0.01em;
  }
  p{ font-size:22px; color:#5B5568; line-height:1.5; margin:0 0 30px; max-width:520px; }
  .price{
    display:inline-flex; align-items:center; gap:10px;
    background:#fff; border:1.5px solid #E4DFF5; border-radius:14px;
    padding: 12px 20px; font-size:19px; font-weight:700; color:#5A3FC0;
  }
  .right{
    position:absolute; right:60px; top:50%; transform:translateY(-50%);
    width:300px; height:560px;
    background:#1A1625; border-radius:44px;
    padding:14px;
    box-shadow: 0 30px 60px -20px rgba(60,40,120,0.35);
  }
  .screen{
    width:100%; height:100%; border-radius:32px;
    background: linear-gradient(165deg, #C558A0, #7A2E63);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding: 0 28px;
  }
  .envelope{
    width:66px; height:66px; border-radius:16px; background:#fff;
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
    font-size:30px;
  }
  .screen .para{ font-size:12px; letter-spacing:0.18em; opacity:0.75; margin-bottom:4px; }
  .screen .name{ font-size:32px; font-weight:800; font-family: Georgia, serif; margin-bottom:10px; }
  .screen .sub{ font-size:14px; opacity:0.85; margin-bottom:26px; }
  .screen .btn{ background:#fff; color:#7A2E63; font-weight:700; font-size:14px; padding:11px 22px; border-radius:999px; }
</style></head>
<body>
  <div class="card">
    <div class="left">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="30" cy="34" rx="22" ry="11" fill="#ffffff" opacity="0.55" transform="rotate(-18 30 34)"/>
            <ellipse cx="70" cy="34" rx="22" ry="11" fill="#ffffff" opacity="0.55" transform="rotate(18 70 34)"/>
            <ellipse cx="32" cy="62" rx="20" ry="9" fill="#ffffff" opacity="0.4" transform="rotate(-10 32 62)"/>
            <ellipse cx="68" cy="62" rx="20" ry="9" fill="#ffffff" opacity="0.4" transform="rotate(10 68 62)"/>
            <rect x="46" y="20" width="8" height="62" rx="4" fill="#ffffff"/>
            <circle cx="50" cy="16" r="8" fill="#ffffff"/>
          </svg>
        </div>
        <span>DragonflAI Labs</span>
      </div>
      <h1>Una app hecha<br>para una sola<br>persona</h1>
      <p>Con su nombre, tu dedicatoria y lo que esa persona necesita tener a la mano. Se guarda en su celular como cualquier app.</p>
      <div class="price">Desde $499 MXN · lista en 3 días</div>
    </div>
    <div class="right">
      <div class="screen">
        <div class="envelope">💌</div>
        <div class="para">PARA</div>
        <div class="name">Ana</div>
        <div class="sub">Alguien te preparó algo.</div>
        <div class="btn">Toca para abrir</div>
      </div>
    </div>
  </div>
</body></html>
