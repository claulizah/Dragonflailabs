<style>
  :root{
    --bg: #FBF4EE;
    --card: #FFFFFF;
    --plum: #C97A45;
    --plum-dark: #B9633C;
    --sage: #7E9E82;
    --marigold: #C6A23A;
    --rose: #C97A6E;
    --text: #3A2E26;
    --text-soft: #93816F;
    --border: #EFE1D4;
    --grad-flag: linear-gradient(120deg, var(--plum), var(--plum-dark));
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; min-height:100%; background:var(--bg); }
  body{ font-family: 'Inter', Arial, sans-serif; color: var(--text); -webkit-tap-highlight-color: transparent; }
  h1,h2,h3{ font-family: Georgia, serif; margin:0; }

  .intro-overlay{
    position:fixed; inset:0; background: var(--grad-flag); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px; z-index:50; overflow:hidden;
  }
  .intro-badge{
    width: 108px; height: 108px; border-radius: 28px;
    background: linear-gradient(160deg, #fff, var(--bg));
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 22px;
    animation: float 3s ease-in-out infinite;
    box-shadow: 0 14px 30px -8px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.15);
  }
  .intro-badge img{ width: 62px; height: 62px; object-fit: contain; }
  @media (prefers-reduced-motion: reduce){ .intro-badge{ animation:none; } }
  @keyframes float{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-14px);} }
  .intro-title{ font-size:1.6rem; margin:6px 0 4px; }
  .intro-sub{ opacity:.85; margin-bottom:28px; }
  .intro-btn{
    background:#fff; color: var(--plum-dark); border:none; padding:14px 28px;
    border-radius:14px; font-weight:700; font-size:1rem; cursor:pointer;
  }

  #app{ display:none; max-width:520px; margin:0 auto; padding-bottom:90px; }
  header{
    padding: calc(26px + env(safe-area-inset-top, 0px)) 22px 18px;
    background: var(--grad-flag); color:#fff;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 18px -12px rgba(0,0,0,0.35);
    position: relative; overflow: hidden;
  }
  header .header-tag{
    display:inline-block; background: rgba(255,255,255,0.22); color:#fff;
    font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:5px 11px; border-radius:999px; margin:0 0 10px;
  }
  header .greet{ font-family: Georgia, serif; font-size:1.55rem; margin:0 0 2px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,0.15); }
  header .sub{ color: rgba(255,255,255,0.85); font-size:.9rem; margin:0; text-transform: capitalize; }
  header .deco{ position:absolute; right:22px; top:14px; font-size:1.8rem; opacity:.55; }

  main{ padding: 8px 20px 20px; }
  .screen{ display:none; }
  .screen.active{ display:block; }

  .section-title{ font-size:1.25rem; margin-top:18px; }
  .section-rule{ height:1px; background: var(--border); margin:10px 0 16px; }
  .empty{ color: var(--text-soft); font-size:.92rem; }

  .card{
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px; margin-bottom:16px;
  }

  .countdown-card{ text-align:center; }
  .countdown-card h3{ font-size:1.1rem; color: var(--text-soft); font-weight:600; margin-bottom:4px; }
  .countdown-num{ font-size:3.2rem; font-weight:700; color: var(--plum-dark); font-family: Georgia, serif; line-height:1; }
  .countdown-label{ color: var(--text-soft); font-size:.9rem; margin-top:4px; }
  .edit-link{ background:none; border:none; color: var(--plum-dark); font-size:.85rem; text-decoration:underline; cursor:pointer; padding:6px; }

  .msg-card p{ font-size:1.05rem; line-height:1.5; margin:0 0 10px; }
  .btn-ghost{
    background:none; border:1.5px solid var(--plum); color: var(--plum-dark);
    padding:10px 16px; border-radius:12px; font-weight:600; cursor:pointer; font-size:.92rem;
  }
  .btn-solid{
    background: var(--grad-flag); border:none; color:#fff;
    padding:12px 16px; border-radius:12px; font-weight:700; cursor:pointer; font-size:.95rem;
  }

  nav{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    display:flex; max-width:520px; margin:0 auto; z-index:20;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  nav button{
    flex:1; min-width:0; background:none; padding:9px 2px 11px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color: var(--text-soft); font-size:.62rem; font-weight:700; letter-spacing:.02em;
    text-transform:uppercase; border:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  nav button.active{ color: var(--plum-dark); }
  nav .icon{ font-size:1.25rem; }

  .add-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .add-row input, .add-row textarea{
    width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px;
    font-size:.95rem; font-family:inherit; background:#fff; color:var(--text);
  }
  .add-row textarea{ min-height:70px; resize:vertical; }

  .item{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
  .item-body{ flex:1; min-width:0; }
  .item-text{ font-size:.98rem; }
  .item-text.done{ text-decoration:line-through; color: var(--text-soft); }
  .check{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--sage);
    display:flex; align-items:center; justify-content:center; font-size:.85rem; color:var(--sage);
    flex-shrink:0; cursor:pointer;
  }
  .check.done{ background: var(--sage); color:#fff; }
  .item-del{ background:none; border:none; color: var(--rose); font-size:.82rem; cursor:pointer; }

  .mensaje-card{ display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
  .mensaje-icon{
    width:52px; height:52px; border-radius:12px; flex-shrink:0; font-size:1.4rem;
    background: var(--border); display:flex; align-items:center; justify-content:center;
  }
  .mensaje-info{ flex:1; min-width:0; }
  .mensaje-nombre{ font-weight:700; color: var(--plum-dark); margin-bottom:2px; }
  .mensaje-texto{ font-size:.92rem; color: var(--text-soft); }

  .estado-banner{
    background: var(--border); border-radius:12px; padding:10px 14px; font-size:.9rem;
    margin-bottom:14px; text-align:center;
  }
  .estado-banner.revelado{ background: var(--marigold); color:#fff; font-weight:700; }

  /* Modo armar: herramientas para quien arma la app (solo con ?armar=1 en la URL) */
  body:not(.armando) .solo-armar{ display:none !important; }
  .armar-banner{ position:fixed; top:0; left:0; right:0; z-index:1000; background:#1f1f1f; color:#fff; font:600 0.72rem/1.3 sans-serif; text-align:center; padding:6px 10px; letter-spacing:0.02em; }

  /* Modal propio (reemplaza a los prompt() del navegador) */
  .modal-fondo{ position:fixed; inset:0; z-index:1001; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-caja{ background:var(--card); color:var(--text); width:100%; max-width:440px; border-radius:20px; padding:22px 20px 18px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.4); animation: modalIn .18s ease; }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .modal-caja{ animation:none; } }
  .modal-caja h3{ margin:0 0 14px; font-size:1.1rem; color:var(--plum-dark); line-height:1.3; }
  .modal-campo{ display:block; margin-bottom:12px; }
  .modal-campo span{ display:block; font-size:0.82rem; color:var(--text-soft); font-weight:600; margin-bottom:5px; }
  .modal-campo input, .modal-campo textarea{ width:100%; box-sizing:border-box; font-family:inherit; font-size:1rem; padding:11px 13px; border-radius:12px; border:1.5px solid var(--border); background:var(--card); color:var(--text); }
  .modal-campo textarea{ min-height:140px; font-size:0.82rem; resize:vertical; }
  .modal-botones{ display:flex; gap:10px; margin-top:6px; }
  .modal-botones button{ flex:1; min-height:46px; border-radius:12px; font-family:inherit; font-weight:700; font-size:0.95rem; cursor:pointer; }
  .modal-ok{ background:var(--plum); color:#fff; border:none; }
  .modal-cancel{ background:transparent; color:var(--text-soft); border:1.5px solid var(--border); }

  /* Dedicatoria de quien regala y aviso para instalar */
  .regalo-dedic{ text-align:center; padding:28px 22px 20px; }
  .regalo-dedic .de{ font-size:0.74rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-soft); font-weight:700; margin:0 0 14px; }
  .regalo-dedic .txt{ font-size:1.2rem; line-height:1.55; color:var(--plum-dark); margin:0 0 22px; white-space:pre-line; }
  .regalo-dedic .modal-ok{ width:100%; min-height:48px; border-radius:12px; font-family:inherit; font-weight:700; font-size:0.98rem; cursor:pointer; }
  .regalo-card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px 18px; margin:0 0 16px; box-shadow:0 4px 18px -12px rgba(0,0,0,0.15); }
  .regalo-card summary{ cursor:pointer; font-weight:700; color:var(--plum-dark); list-style:none; font-size:0.95rem; }
  .regalo-card summary::-webkit-details-marker{ display:none; }
  .regalo-card summary::after{ content:" ▾"; color:var(--text-soft); font-weight:400; }
  .regalo-card[open] summary::after{ content:" ▴"; }
  .regalo-card .txt{ margin:10px 0 0; line-height:1.55; color:var(--text); white-space:pre-line; }
  .regalo-instalar h4{ margin:0 0 4px; font-size:1rem; color:var(--plum-dark); }
  .regalo-instalar p{ margin:0 0 6px; font-size:0.9rem; color:var(--text-soft); line-height:1.45; }
  .regalo-instalar ol{ margin:6px 0 10px; padding-left:20px; line-height:1.6; font-size:0.92rem; color:var(--text); }
  .regalo-instalar .fila{ display:flex; gap:8px; flex-wrap:wrap; }
  .regalo-instalar button{ background:transparent; border:1.5px solid var(--border); color:var(--text-soft); border-radius:10px; padding:8px 12px; font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer; }
</style>
</head>

<script>
// ==== MODO ARMAR ====
// Las herramientas para quien arma la app (escribir mensajes sellados, borrarlos y los
// botones "Fijar ... en el código") solo aparecen si la URL trae ?armar=1.
// Quien recibe la app abre la liga normal y no las ve.
const MODO_ARMAR = new URLSearchParams(location.search).get('armar') === '1';
if(MODO_ARMAR){
  document.body.classList.add('armando');
  const aviso = document.createElement('div');
  aviso.className = 'armar-banner';
  aviso.textContent = 'Modo armar · quien recibe no ve estas herramientas';
  document.body.appendChild(aviso);
}

// ==== MODAL (reemplaza a los prompt() del navegador) ====
// pedir({ titulo, campos: [{ etiqueta, valor, tipo: 'text'|'date'|'number'|'tel'|'largo', placeholder, soloLectura }] })
// Devuelve una promesa con un arreglo de textos (uno por campo), o null si la persona cancela.
function pedir({ titulo, campos, aceptar = 'Guardar', cancelar = 'Cancelar' }){
  return new Promise(resolve => {
    const fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    const caja = document.createElement('form');
    caja.className = 'modal-caja';
    const h = document.createElement('h3');
    h.textContent = titulo;
    caja.appendChild(h);
    const inputs = campos.map(c => {
      const label = document.createElement('label');
      label.className = 'modal-campo';
      if(c.etiqueta){ const sp = document.createElement('span'); sp.textContent = c.etiqueta; label.appendChild(sp); }
      const inp = document.createElement(c.tipo === 'largo' ? 'textarea' : 'input');
      if(c.tipo !== 'largo') inp.type = c.tipo || 'text';
      if(c.tipo === 'number'){ inp.inputMode = 'numeric'; inp.min = '1'; }
      inp.value = c.valor == null ? '' : String(c.valor);
      if(c.placeholder) inp.placeholder = c.placeholder;
      if(c.soloLectura) inp.readOnly = true;
      label.appendChild(inp);
      caja.appendChild(label);
      return inp;
    });
    const botones = document.createElement('div');
    botones.className = 'modal-botones';
    const bCancel = document.createElement('button');
    bCancel.type = 'button'; bCancel.className = 'modal-cancel'; bCancel.textContent = cancelar;
    const bOk = document.createElement('button');
    bOk.type = 'submit'; bOk.className = 'modal-ok'; bOk.textContent = aceptar;
    botones.append(bCancel, bOk);
    caja.appendChild(botones);
    function esc(e){ if(e.key === 'Escape') cerrar(null); }
    function cerrar(valor){ document.removeEventListener('keydown', esc); fondo.remove(); resolve(valor); }
    caja.onsubmit = e => { e.preventDefault(); cerrar(inputs.map(i => i.value)); };
    bCancel.onclick = () => cerrar(null);
    fondo.onclick = e => { if(e.target === fondo) cerrar(null); };
    document.addEventListener('keydown', esc);
    fondo.appendChild(caja);
    document.body.appendChild(fondo);
    setTimeout(() => { if(inputs[0] && !inputs[0].readOnly) inputs[0].focus(); }, 50);
  });
}
// Un solo campo: se usa igual que prompt() (texto, o null si cancela).
async function pedirUno(titulo, valor, extra = {}){
  const r = await pedir({ titulo, campos: [{ valor, ...extra }] });
  return r ? r[0] : null;
}
// Muestra un texto para copiar (cuando el portapapeles no está disponible).
async function mostrarTexto(titulo, texto){
  const fondoPrevio = document.querySelectorAll('.modal-fondo').length;
  const promesa = pedir({ titulo, campos: [{ tipo: 'largo', valor: texto, soloLectura: true }], aceptar: 'Copiar', cancelar: 'Cerrar' });
  const area = document.querySelectorAll('.modal-fondo')[fondoPrevio].querySelector('textarea');
  area.addEventListener('focus', () => area.select());
  const r = await promesa;
  if(r){
    try{ await navigator.clipboard.writeText(texto); }
    catch(e){
      const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); }catch(_){}
      t.remove();
    }
  }
}
// ==== DEDICATORIA Y AVISO PARA INSTALAR ====
// La dedicatoria (PRESET_DE / PRESET_DEDICATORIA) sale una sola vez después de "Toca para abrir"
// y luego queda en la pestaña Hoy. El aviso de "Guárdala en tu pantalla de inicio" sale en Hoy
// hasta que la persona lo cierra, y no aparece si la app ya está instalada.
const REGALO_VISTA = 'regalo-dedicatoria-vista';   // se guarda como APP_PREFIX + clave
const REGALO_INSTALAR = 'regalo-instalar-cerrado';
function leerMarca(k){ try{ return localStorage.getItem(APP_PREFIX + k) === '1'; }catch(e){ return false; } }
function ponerMarca(k){ try{ localStorage.setItem(APP_PREFIX + k, '1'); }catch(e){} }
function hayDedicatoria(){ return !!(PRESET_DEDICATORIA.trim() || PRESET_DE.trim()); }
function textoDe(){ return PRESET_DE.trim() ? `Un regalo de ${PRESET_DE.trim()}` : 'Un regalo para ti'; }
function appInstalada(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
let regaloAbierto = false;
function despuesDeAbrir(){
  if(regaloAbierto) return;
  regaloAbierto = true;
  if(hayDedicatoria() && !leerMarca(REGALO_VISTA)) mostrarDedicatoria();
}
function mostrarDedicatoria(){
  const fondo = document.createElement('div');
  fondo.className = 'modal-fondo';
  const caja = document.createElement('div');
  caja.className = 'modal-caja regalo-dedic';
  const de = document.createElement('p'); de.className = 'de'; de.textContent = textoDe();
  const txt = document.createElement('p'); txt.className = 'txt display'; txt.textContent = PRESET_DEDICATORIA.trim();
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'modal-ok'; btn.textContent = 'Abrir mi app';
  btn.onclick = () => { ponerMarca(REGALO_VISTA); fondo.remove(); };
  caja.append(de);
  if(txt.textContent) caja.append(txt);
  caja.append(btn);
  fondo.appendChild(caja);
  document.body.appendChild(fondo);
}
function pasosInstalar(){
  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  if(ios && /CriOS|FxiOS|EdgiOS|OPiOS|Instagram|FBAN|FBAV|WhatsApp|Line\//.test(ua)){
    return { intro: 'En iPhone solo se puede guardar desde Safari. Copia la liga, ábrela en Safari y luego:', pasos: ['Toca el botón Compartir (el cuadrito con la flecha hacia arriba).', 'Elige "Agregar a inicio".', 'Toca "Agregar".'], copiar: true };
  }
  if(ios) return { intro: 'Así queda como una app más en tu iPhone:', pasos: ['Toca el botón Compartir (el cuadrito con la flecha hacia arriba), abajo en Safari.', 'Desliza y elige "Agregar a inicio".', 'Toca "Agregar".'] };
  if(android) return { intro: 'Así queda como una app más en tu celular:', pasos: ['Toca el menú ⋮ arriba a la derecha en Chrome.', 'Elige "Agregar a pantalla principal" (o "Instalar app").', 'Confirma con "Agregar".'] };
  return { intro: 'Ábrela desde tu celular para guardarla en tu pantalla de inicio:', pasos: ['iPhone: en Safari toca Compartir y luego "Agregar a inicio".', 'Android: en Chrome toca el menú ⋮ y luego "Agregar a pantalla principal".'] };
}
function pintarRegalo(){
  const cont = document.getElementById('regaloExtras');
  if(!cont) return;
  // Si la app pide el nombre al abrir, eso va primero y las tarjetas después.
  const pideNombre = document.getElementById('setupBlock');
  if(pideNombre && pideNombre.nextElementSibling !== cont) pideNombre.after(cont);
  cont.innerHTML = '';
  if(hayDedicatoria()){
    const d = document.createElement('details');
    d.className = 'regalo-card';
    const s = document.createElement('summary'); s.textContent = '💌 ' + textoDe();
    d.appendChild(s);
    if(PRESET_DEDICATORIA.trim()){ const t = document.createElement('p'); t.className = 'txt'; t.textContent = PRESET_DEDICATORIA.trim(); d.appendChild(t); }
    cont.appendChild(d);
  }
  if(!appInstalada() && !leerMarca(REGALO_INSTALAR)){
    const info = pasosInstalar();
    const c = document.createElement('div');
    c.className = 'regalo-card regalo-instalar';
    const h = document.createElement('h4'); h.textContent = '📲 Guárdala en tu pantalla de inicio';
    const p = document.createElement('p'); p.textContent = info.intro;
    const ol = document.createElement('ol');
    info.pasos.forEach(x => { const li = document.createElement('li'); li.textContent = x; ol.appendChild(li); });
    const fila = document.createElement('div'); fila.className = 'fila';
    if(info.copiar){
      const bc = document.createElement('button'); bc.type = 'button'; bc.textContent = 'Copiar liga';
      bc.onclick = async () => {
        const liga = location.href.replace(/([?&])armar=1&?/, '$1').replace(/[?&]$/, '');
        try{ await navigator.clipboard.writeText(liga); bc.textContent = 'Liga copiada ✓'; }catch(e){ mostrarTexto('Copia esta liga y ábrela en Safari', liga); }
      };
      fila.appendChild(bc);
    }
    const bx = document.createElement('button'); bx.type = 'button'; bx.textContent = 'Ya la guardé ✕';
    bx.onclick = () => { ponerMarca(REGALO_INSTALAR); c.remove(); };
    fila.appendChild(bx);
    c.append(h, p, ol, fila);
    cont.appendChild(c);
  }
}
// Se pinta cuando ya terminó de cargar el script (las PRESET_ se declaran más abajo).
setTimeout(pintarRegalo, 0);

/* ============================================================
   LO ÚNICO QUE HAY QUE LLENAR ANTES DE ENTREGAR CADA PEDIDO
   ============================================================ */
const PRESET_NAME = "";           // nombre del festejado, ej. "Vale"
// Dedicatoria de quien regala: sale en una tarjetita después de "Toca para abrir"
// y luego queda en la pestaña Hoy. Vacíos = no aparece.
const PRESET_DE = "";            // ej. "Ana" (sale como "Un regalo de Ana")
const PRESET_DEDICATORIA = "";   // ej. "Para que nunca se te olvide lo fuerte que eres."
const PRESET_FESTEJO = "";        // ej. "Tu graduación", "Tu cumpleaños"
const PRESET_FECHA = "";          // AAAA-MM-DD

// Pega aquí lo que exportes desde el botón "Fijar mensajes en el código"
// (dentro de la pestaña Mensajes) para que el festejado vea todos los
// mensajes desde que abra la app la primera vez.
const PRESET_MENSAJES_SORPRESA = [];

/* ============================================================ */

const APP_PREFIX = 'app-sorpresa-';

async function safeGet(key){
  try{ return localStorage.getItem(APP_PREFIX + key); }catch(e){ return null; }
}
async function safeSet(key, value){
  try{ localStorage.setItem(APP_PREFIX + key, value); }catch(e){}
}

const MESSAGES = [
  "Hay gente que te quiere celebrando este momento contigo, aunque no la veas ahorita.",
  "Cada quien que te escribió aquí, lo hizo pensando en ti con cariño.",
  "Falta menos para el día — disfruta también la espera.",
  "Este ratito es solo tuyo, tómate tu tiempo para abrirlo.",
  "Alguien pensó que merecías algo hecho solo para ti. Y tenía razón.",
  "La cuenta regresiva también es parte bonita de la sorpresa.",
  "Cada persona que dejó un mensaje aquí, se tomó un momento solo por ti.",
  "Ya casi es tu día — se nota que te quieren celebrar bien.",
  "No tienes que hacer nada, solo disfrutar lo que se armó para ti.",
  "Guarda este momento, es más especial de lo que crees.",
  "Falta poquito para que veas todo lo que prepararon para ti.",
  "Hoy es un buen día para sentirte querido/a, aunque falte para el grande.",
  "Cada tache en la cuenta regresiva te acerca a algo que armaron con cariño.",
  "No estás solo/a en este momento — hay gente celebrando contigo desde ya.",
  "Ya casi llega el día que tanto se merece festejarse."
];

let state = { name: "", reminders: [], notes: [], mensajes: [], currentMsgIndex: 0, countdown: { name: "Tu día especial", date: "" }, messagePool: [] };

function dayOfYear(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function openIntro(){
  document.getElementById('introOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  despuesDeAbrir();
}

function showTab(tab){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelector(`nav button[data-tab="${tab}"]`).classList.add('active');
}

async function init(){
  const name = await safeGet('name');
  const reminders = await safeGet('reminders');
  const notes = await safeGet('notes');
  const mensajes = await safeGet('mensajes');
  const countdown = await safeGet('countdown');

  state.name = name || PRESET_NAME || "";
  if(!name && PRESET_NAME){ await safeSet('name', PRESET_NAME); }

  try{ state.reminders = reminders ? JSON.parse(reminders) : []; }catch(e){ state.reminders = []; }
  try{ state.notes = notes ? JSON.parse(notes) : []; }catch(e){ state.notes = []; }

  try{ state.mensajes = mensajes ? JSON.parse(mensajes) : []; }catch(e){ state.mensajes = []; }
  if(state.mensajes.length === 0 && PRESET_MENSAJES_SORPRESA.length > 0){
    state.mensajes = PRESET_MENSAJES_SORPRESA;
    await safeSet('mensajes', JSON.stringify(state.mensajes));
  }

  const presetCountdown = { name: PRESET_FESTEJO || state.countdown.name, date: PRESET_FECHA || state.countdown.date };
  try{ state.countdown = countdown ? JSON.parse(countdown) : presetCountdown; }catch(e){ state.countdown = presetCountdown; }
  if(!countdown && (PRESET_FESTEJO || PRESET_FECHA)){
    await safeSet('countdown', JSON.stringify(state.countdown));
  }

  state.messagePool = MESSAGES;
  state.currentMsgIndex = dayOfYear() % state.messagePool.length;

  renderGreeting();
  renderCountdown();
  renderMessage();
  renderReminders();
  renderNotes();
  renderMensajesSorpresa();
}

function renderGreeting(){
  const nombre = state.name ? state.name : '';
  document.getElementById('greeting').textContent = nombre ? `Hola, ${nombre} 💌` : 'Hola 💌';
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('introTitle').textContent = nombre ? `Para ${nombre}` : 'Para ti';
}

function renderMessage(){
  document.getElementById('dailyMessage').textContent = state.messagePool[state.currentMsgIndex];
}
function shuffleMessage(){
  let next;
  do{ next = Math.floor(Math.random() * state.messagePool.length); }while(next === state.currentMsgIndex && state.messagePool.length > 1);
  state.currentMsgIndex = next;
  renderMessage();
}

function renderCountdown(){
  document.getElementById('cdTitle').textContent = state.countdown.name || 'Tu día especial';
  const numEl = document.getElementById('cdNum');
  const labelEl = document.getElementById('cdLabel');
  if(!state.countdown.date){
    numEl.textContent = '--';
    labelEl.textContent = 'toca "editar fecha" para ponerla';
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(state.countdown.date + 'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  if(diffDays > 0){
    numEl.textContent = diffDays;
    labelEl.textContent = diffDays === 1 ? 'día para el gran día' : 'días para el gran día';
  } else if(diffDays === 0){
    numEl.textContent = '🎉';
    labelEl.textContent = '¡Hoy es el día!';
  } else {
    numEl.textContent = '✨';
    labelEl.textContent = 'ya pasó, esperamos que la hayas pasado increíble';
  }
}

async function editCountdown(){
  const r = await pedir({ titulo: 'Cuenta regresiva', campos: [
    { etiqueta: '¿Cómo se llama esta fecha? (graduación, cumpleaños, etc.)', valor: state.countdown.name },
    { etiqueta: 'Fecha', tipo: 'date', valor: state.countdown.date || new Date().toLocaleDateString('en-CA') }
  ] });
  if(!r) return;
  const [name, date] = r;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date.trim())){ alert('Formato de fecha inválido, usa AAAA-MM-DD'); return; }
  state.countdown = { name: name.trim() || 'Tu día especial', date: date.trim() };
  await safeSet('countdown', JSON.stringify(state.countdown));
  renderCountdown();
  renderMensajesSorpresa();
}

function isCountdownReached(){
  if(!state.countdown.date) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(state.countdown.date + 'T00:00:00');
  return today >= target;
}

/* RECORDATORIOS */
async function addReminder(){
  const el = document.getElementById('reminderText');
  const text = el.value.trim();
  if(!text) return;
  state.reminders.push({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), text, done:false });
  el.value = '';
  await safeSet('reminders', JSON.stringify(state.reminders));
  renderReminders();
}
function renderReminders(){
  const list = document.getElementById('reminderList');
  list.innerHTML = '';
  if(state.reminders.length === 0){
    list.innerHTML = '<p class="empty">No tienes recordatorios todavía.</p>';
    return;
  }
  state.reminders.forEach(r => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <div class="check ${r.done ? 'done' : ''}">${r.done ? '✓' : ''}</div>
      <div class="item-body"><div class="item-text ${r.done ? 'done' : ''}">${escapeHtml(r.text)}</div></div>
      <button class="item-del">Eliminar</button>
    `;
    item.querySelector('.check').onclick = () => toggleReminder(r.id);
    item.querySelector('.item-del').onclick = () => deleteReminder(r.id);
    list.appendChild(item);
  });
}
async function toggleReminder(id){
  const r = state.reminders.find(x => x.id === id);
  if(r){ r.done = !r.done; }
  await safeSet('reminders', JSON.stringify(state.reminders));
  renderReminders();
}
async function deleteReminder(id){
  state.reminders = state.reminders.filter(x => x.id !== id);
  await safeSet('reminders', JSON.stringify(state.reminders));
  renderReminders();
}

/* NOTAS */
async function addNote(){
  const el = document.getElementById('noteText');
  const text = el.value.trim();
  if(!text) return;
  state.notes.unshift({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), text, date: new Date().toLocaleDateString('es-MX', {day:'numeric', month:'short'}) });
  el.value = '';
  await safeSet('notes', JSON.stringify(state.notes));
  renderNotes();
}
function renderNotes(){
  const list = document.getElementById('noteList');
  list.innerHTML = '';
  if(state.notes.length === 0){
    list.innerHTML = '<p class="empty">Aún no escribes nada aquí.</p>';
    return;
  }
  state.notes.forEach(n => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <div class="item-body">
        <div class="item-text">${escapeHtml(n.text)}</div>
        <div style="font-size:.78rem; color:var(--text-soft); margin-top:2px;">${n.date}</div>
      </div>
      <button class="item-del">Eliminar</button>
    `;
    item.querySelector('.item-del').onclick = () => deleteNote(n.id);
    list.appendChild(item);
  });
}
async function deleteNote(id){
  state.notes = state.notes.filter(x => x.id !== id);
  await safeSet('notes', JSON.stringify(state.notes));
  renderNotes();
}

/* MENSAJES SORPRESA (varios → uno, sellados hasta la fecha) */
async function addMensajeSorpresa(){
  const nombreEl = document.getElementById('mensajeNombre');
  const textoEl = document.getElementById('mensajeTexto');
  const nombre = nombreEl.value.trim();
  const mensaje = textoEl.value.trim();
  if(!nombre || !mensaje){ alert('Ponle nombre y un mensaje.'); return; }
  state.mensajes.push({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), nombre, mensaje });
  nombreEl.value = ''; textoEl.value = '';
  await safeSet('mensajes', JSON.stringify(state.mensajes));
  renderMensajesSorpresa();
}

function renderMensajesSorpresa(){
  const list = document.getElementById('mensajesList');
  const estado = document.getElementById('mensajesEstado');
  const preview = document.getElementById('mensajesPreviewBox');
  const revelado = isCountdownReached();

  estado.textContent = revelado
    ? '¡Ya es el día! Todos los mensajes están desbloqueados 🎉'
    : `Se revelan el ${state.countdown.date ? new Date(state.countdown.date + 'T00:00:00').toLocaleDateString('es-MX', {day:'numeric', month:'long'}) : 'día de tu festejo'}.`;
  estado.classList.toggle('revelado', revelado);

  list.innerHTML = '';
  if(state.mensajes.length === 0){
    list.innerHTML = '<p class="empty">Aún no hay mensajes agregados.</p>';
  } else {
    state.mensajes.forEach(m => {
      const card = document.createElement('div');
      card.className = 'mensaje-card';
      card.innerHTML = revelado
        ? `<div class="mensaje-icon">💌</div>
           <div class="mensaje-info">
             <div class="mensaje-nombre">${escapeHtml(m.nombre)}</div>
             <div class="mensaje-texto">${escapeHtml(m.mensaje)}</div>
           </div>
           <button class="item-del solo-armar" style="align-self:flex-start;">Eliminar</button>`
        : `<div class="mensaje-icon">🔒</div>
           <div class="mensaje-info">
             <div class="mensaje-nombre">${escapeHtml(m.nombre)}</div>
             <div class="mensaje-texto">Mensaje sellado hasta el día</div>
           </div>
           <button class="item-del solo-armar" style="align-self:flex-start;">Eliminar</button>`;
      card.querySelector('.item-del').onclick = () => deleteMensajeSorpresa(m.id);
      list.appendChild(card);
    });
  }

  // vista previa chiquita en la pestaña Hoy
  if(state.mensajes.length > 0){
    preview.innerHTML = revelado
      ? `<div class="card"><p style="margin:0 0 8px; font-weight:700;">Tienes ${state.mensajes.length} mensaje${state.mensajes.length===1?'':'s'} 💌</p><button class="btn-ghost" style="width:100%;" onclick="showTab('mensajes')">Léelos</button></div>`
      : `<div class="card"><p style="margin:0 0 8px;">Hay ${state.mensajes.length} mensaje${state.mensajes.length===1?'':'s'} sellado${state.mensajes.length===1?'':'s'} esperándote 🔒</p></div>`;
  } else {
    preview.innerHTML = '';
  }
}

async function deleteMensajeSorpresa(id){
  state.mensajes = state.mensajes.filter(m => m.id !== id);
  await safeSet('mensajes', JSON.stringify(state.mensajes));
  renderMensajesSorpresa();
}

function exportarMensajesSorpresa(){
  if(state.mensajes.length === 0){
    alert('Agrega al menos un mensaje antes de fijarlo en el código.');
    return;
  }
  const codigo = 'const ' + `PRESET_MENSAJES_SORPRESA = ${JSON.stringify(state.mensajes).replace(/;/g, '\\u003b').replace(/</g, '\\u003c')};`;
  const aviso = 'Copia este texto y pégalo en el archivo, reemplazando la línea de PRESET_MENSAJES_SORPRESA (cerca del inicio del <script>). También llena PRESET_NAME, PRESET_FESTEJO y PRESET_FECHA justo arriba. Así el festejado ve todo desde que abre la app:';
  navigator.clipboard.writeText(codigo).then(() => alert('Copiado ✓\n\n' + aviso), () => mostrarTexto(aviso, codigo));
}

/* RESET */
function resetApp(){
  if(!confirm('¿Borrar todo (nombre, recordatorios, notas, mensajes, etc.) y empezar de cero?')) return;
  ['name','reminders','notes','mensajes','countdown'].forEach(k => {
    try{ localStorage.removeItem(APP_PREFIX + k); }catch(e){}
  });
  location.reload();
}

init();
</script>
